name: Create provider release

# Stub on the default branch so GitHub will accept workflow_dispatch and
# workflow_call of create-release.yaml from other refs. The Terraform
# create-release workflow calls this file via uses:. Replace this stub by
# merging the real create-release workflow.

permissions: {}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Provider version (e.g. v2.26.0)
        required: true
        type: string
      port_run_id:
        description: Port run ID (optional, set by the SSA)
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: Provider version (e.g. v2.26.0)
        required: true
        type: string
      port_run_id:
        description: Port run ID (optional, set by the SSA)
        required: false
        type: string
    secrets:
      PORT_MACHINE_USER_GITHUB_TOKEN:
        required: true

jobs:
  refuse:
    name: Stub only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse default-branch runs
        run: |
          echo "::error::create-release.yaml on the default branch is a GitHub dispatch stub. Dispatch task_tdscp0/automate_the_process_of_tf_provider_and_pulumi_releases."
          exit 1
