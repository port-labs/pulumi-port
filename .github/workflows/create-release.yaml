name: Create provider release

run-name: Create provider release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Provider version (e.g. v2.26.0)
        required: true
        type: string
      port_run_id:
        description: Port run ID (optional, set by the SSA)
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: Provider version (e.g. v2.26.0)
        required: true
        type: string
      port_run_id:
        description: Port run ID (optional, set by the SSA)
        required: false
        type: string
    secrets:
      PORT_MACHINE_USER_GITHUB_TOKEN:
        required: true

permissions:
  contents: write

# Distinct from terraform-provider-port-labs create-release. Nested reusable
# workflows that share a concurrency group deadlock in the caller repo.
concurrency:
  group: pulumi-port-create-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  wait_for_terraform_registry:
    name: Wait for Terraform Registry
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Poll Terraform Registry for version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RAW_VERSION#v}"
          URL="https://registry.terraform.io/v1/providers/port-labs/port-labs/${VERSION}"
          echo "Waiting for ${URL}"
          for _ in $(seq 1 60); do
            if curl -fsS "$URL" >/dev/null; then
              echo "Found ${VERSION} on the Terraform Registry"
              exit 0
            fi
            echo "Not published yet, retrying in 30s..."
            sleep 30
          done
          echo "::error::Timed out waiting for terraform-provider-port-labs ${VERSION} on the Terraform Registry"
          exit 1

  upgrade_provider:
    name: Upgrade TF provider
    needs: wait_for_terraform_registry
    uses: ./.github/workflows/upgrade-provider-only.yaml
    with:
      version: ${{ inputs.version }}
    secrets:
      PORT_MACHINE_USER_GITHUB_TOKEN: ${{ secrets.PORT_MACHINE_USER_GITHUB_TOKEN }}
    permissions:
      contents: write

  create_release:
    name: Create GitHub release
    needs: [wait_for_terraform_registry, upgrade_provider]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PORT_MACHINE_USER_GITHUB_TOKEN }}
      GH_REPO: port-labs/pulumi-port
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: port-labs/pulumi-port
          token: ${{ secrets.PORT_MACHINE_USER_GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Normalize version
        id: normalize
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RAW_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z or vX.Y.Z, got: ${RAW_VERSION}"
            exit 1
          fi
          VERSION="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using version ${VERSION}"

      - name: Fail if tag already exists
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/${GH_REPO}/git/refs/tags/${VERSION}" --silent >/dev/null 2>&1; then
            echo "::error::Tag ${VERSION} already exists in ${GH_REPO}"
            exit 1
          fi

      - name: Create GitHub release
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --repo "$GH_REPO" \
            --generate-notes \
            --title "$VERSION"
          echo "Created GitHub release ${VERSION}"

  wait_for_packages:
    name: Wait for Go, npm, and PyPI packages
    needs: create_release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Poll Go, npm, and PyPI for version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RAW_VERSION#v}"
          GO_URL="https://pkg.go.dev/github.com/port-labs/terraform-provider-port-labs/v2@v${VERSION}/provider"
          NPM_URL="https://registry.npmjs.org/@port-labs/port/${VERSION}"
          PYPI_URL="https://pypi.org/pypi/port-pulumi/${VERSION}/json"
          echo "Waiting up to 30 minutes for:"
          echo "  Go   ${GO_URL}"
          echo "  npm  https://www.npmjs.com/package/@port-labs/port"
          echo "  PyPI https://pypi.org/project/port-pulumi/${VERSION}/"

          published() {
            curl -fsS -o /dev/null "$1"
          }

          for _ in $(seq 1 60); do
            missing=()
            if published "$GO_URL"; then
              echo "Found Go module terraform-provider-port-labs/v2@v${VERSION}"
            else
              missing+=("Go")
            fi
            if published "$NPM_URL"; then
              echo "Found npm @port-labs/port@${VERSION}"
            else
              missing+=("npm")
            fi
            if published "$PYPI_URL"; then
              echo "Found PyPI port-pulumi ${VERSION}"
            else
              missing+=("PyPI")
            fi
            if [[ ${#missing[@]} -eq 0 ]]; then
              echo "Go, npm, and PyPI packages are published"
              exit 0
            fi
            echo "Still waiting on: ${missing[*]}. Retrying in 30s..."
            sleep 30
          done
          echo "::error::Timed out waiting 30 minutes for Go, npm, and/or PyPI packages at ${VERSION}"
          exit 1
