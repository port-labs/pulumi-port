name: Upgrade the TF provider only

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      version:
        description: Upstream Terraform provider version (e.g. v2.26.0)
        required: false
        type: string
        default: ""
    secrets:
      PORT_MACHINE_USER_GITHUB_TOKEN:
        required: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.PORT_MACHINE_USER_GITHUB_TOKEN }}
  PULUMI_PROVIDER_REPO: port-labs/pulumi-port

jobs:
  upgrade_provider:
    name: upgrade-provider
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pulumi-port
        uses: actions/checkout@v4
        with:
          repository: port-labs/pulumi-port
          token: ${{ secrets.PORT_MACHINE_USER_GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.PORT_MACHINE_USER_GITHUB_TOKEN }}
          cache_key: "mise-{{platform}}-{{file_hash}}"
          cache_save: false

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@25d5e2dd555cd74f1fab9ac1e6ea117acde2c0c4 # tag=v1.12.0
        with:
          repo: pulumi/pulumictl

      - name: Install Pulumi CLI
        uses: pulumi/actions@v4

      - name: Install upgrade-provider
        run: go install github.com/pulumi/upgrade-provider@main

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6"

      - name: Set up git identity
        run: |
          git config --global user.name 'pulumi-port-bot'
          git config --global user.email 'getport.io'

      - name: Run upgrade-provider
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          extra=()
          if [[ -n "${RAW_VERSION}" ]]; then
            extra+=(--target-version "${RAW_VERSION#v}")
          fi
          upgrade-provider "$PULUMI_PROVIDER_REPO" \
            --kind=provider \
            --repo-path=. \
            --no-submit \
            --target-bridge-version=latest \
            "${extra[@]}"

      - name: Push upgrade to main
        run: |
          set -euo pipefail
          git status
          git log -5 --oneline
          git push origin HEAD:main
